name: Minecraft 26.3 compatibility

on:
  pull_request:
    branches: [main]
  push:
    branches: [port/minecraft-26.3]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
      - uses: gradle/actions/setup-gradle@v4
      - run: chmod +x gradlew
      - name: Compile addon for Nova 0.25 / MC 26.3
        run: ./gradlew clean addonJar -PoutDir=artifacts
      - uses: actions/upload-artifact@v4
        if: success()
        with:
          name: FarmersDelight-MC-26.3
          path: artifacts/*.jar
